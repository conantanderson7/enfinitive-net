<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First action — Enfinitive</title>
  <meta name="description" content="Finish one unfinished thing that serves the perfection of conscious being.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="mark">Enfinitive</p>
    <h1>First action</h1>
    <p style="margin-top:1.5rem;color:#9a9386;font-size:1.15rem;line-height:1.5">
      Finish one unfinished thing that serves the perfection of conscious being, all the way.
    </p>
    <p style="margin-top:1.25rem;color:#e8e2d6;font-size:1.05rem;line-height:1.55">
      Choose something already started. Complete it. Bring the result so another person can see it.
    </p>
    <p style="margin-top:1.25rem;color:#9a9386;font-size:1rem;line-height:1.5">
      Only a virtuous thing. If it is not of true virtue, it is not this action.
    </p>
  </main>
</body>
</html>
